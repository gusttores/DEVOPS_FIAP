apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: govambiental-db
  labels:
    app.kubernetes.io/name: govambiental-db
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: govambiental
spec:
  serviceName: govambiental-db
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: govambiental-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: govambiental-db
        app.kubernetes.io/component: database
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        fsGroup: 10001
      containers:
        - name: mssql
          image: mcr.microsoft.com/mssql/server:2022-latest
          ports:
            - name: mssql
              containerPort: 1433
          env:
            - name: ACCEPT_EULA
              value: "Y"
            - name: MSSQL_PID
              value: "Developer"
            - name: MSSQL_SA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: govambiental-api-secret
                  key: SA_PASSWORD
          volumeMounts:
            - name: mssql-data
              mountPath: /var/opt/mssql
          resources:
            requests:
              cpu: "250m"
              memory: "2Gi"
            limits:
              cpu: "1"
              memory: "3Gi"
          readinessProbe:
            tcpSocket:
              port: 1433
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 1433
            initialDelaySeconds: 60
            periodSeconds: 20
  # PersistentVolumeClaim: os dados do banco sobrevivem ao recriar o pod.
  volumeClaimTemplates:
    - metadata:
        name: mssql-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
