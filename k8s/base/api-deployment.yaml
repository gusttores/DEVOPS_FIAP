apiVersion: apps/v1
kind: Deployment
metadata:
  name: govambiental-api
  labels:
    app.kubernetes.io/name: govambiental-api
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: govambiental
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: govambiental-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: govambiental-api
        app.kubernetes.io/component: backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
      containers:
        - name: api
          # A tag é substituída pelo overlay (kustomize edit set image).
          image: ghcr.io/gusttores/govambiental-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: govambiental-api-config
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"
            - name: Jwt__Key
              valueFrom:
                secretKeyRef:
                  name: govambiental-api-secret
                  key: Jwt__Key
            - name: AuthCredentials__Senha
              valueFrom:
                secretKeyRef:
                  name: govambiental-api-secret
                  key: AuthCredentials__Senha
            - name: SA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: govambiental-api-secret
                  key: SA_PASSWORD
            # A connection string é montada com a senha vinda do Secret.
            - name: ConnectionStrings__DefaultConnection
              value: "Server=govambiental-db,1433;Database=GovAmbientalDb;User Id=sa;Password=$(SA_PASSWORD);TrustServerCertificate=True;Encrypt=False"
          resources:
            requests:
              cpu: "100m"
              memory: "192Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
          # Startup: dá tempo das migrations rodarem antes das demais probes.
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
