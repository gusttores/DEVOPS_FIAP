# =============================================================================
# Ambiente de PRODUÇÃO
#   docker compose --env-file .env.prod -f docker-compose.prod.yml up -d
#   API ..... http://localhost:8080/swagger
#
# Endurecimentos em relação a staging: restart always, read_only no container
# da API, no-new-privileges, limites de CPU/memória maiores, rotação de logs
# e senhas obrigatórias (o compose falha se não forem informadas).
# =============================================================================
name: govambiental-prod

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: govambiental-db-prod
    platform: ${DB_PLATFORM:-linux/amd64}
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD:?defina SA_PASSWORD no .env.prod}
      MSSQL_PID: "Developer"
    volumes:
      - govambiental-db-prod:/var/opt/mssql
    networks:
      - govambiental-prod
    healthcheck:
      # Versões recentes da imagem do SQL Server não trazem mais o sqlcmd, então
      # o teste cai para uma checagem de porta TCP quando a ferramenta não existe.
      test: >-
        /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -No -Q "SELECT 1" > /dev/null 2>&1
        || timeout 3 bash -c "< /dev/tcp/localhost/1433"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: always
    deploy:
      resources:
        limits:
          memory: 3g

  api:
    image: ${IMAGE_NAME:-ghcr.io/gusttores/govambiental-api}:${IMAGE_TAG:-latest}
    container_name: govambiental-api-prod
    pull_policy: ${PULL_POLICY:-always}
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      APP_VERSION: ${IMAGE_TAG:-latest}
      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=${DB_NAME:-GovAmbientalDb};User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;Encrypt=False"
      Jwt__Key: ${JWT_KEY:?defina JWT_KEY no .env.prod}
      Jwt__Issuer: ${JWT_ISSUER:-GovAmbiental.API}
      Jwt__Audience: ${JWT_AUDIENCE:-GovAmbiental.Clients}
      AuthCredentials__Email: ${AUTH_EMAIL:-auditor@govambiental.com}
      AuthCredentials__Senha: ${AUTH_PASSWORD:?defina AUTH_PASSWORD no .env.prod}
    ports:
      - "${API_PORT:-8080}:8080"
    networks:
      - govambiental-prod
    restart: always
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1g
        reservations:
          cpus: "0.5"
          memory: 256m
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

networks:
  govambiental-prod:
    driver: bridge

volumes:
  govambiental-db-prod:
    driver: local
