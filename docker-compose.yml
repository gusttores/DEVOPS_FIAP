# =============================================================================
# Ambiente LOCAL / DESENVOLVIMENTO
#   docker compose up -d --build
#   API .......... http://localhost:8080/swagger
#   Health ....... http://localhost:8080/health
# =============================================================================
name: govambiental-dev

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: govambiental-db-dev
    platform: ${DB_PLATFORM:-linux/amd64}
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD:-Gov@mbiental2026}
      MSSQL_PID: "Developer"
    ports:
      - "${DB_PORT:-1433}:1433"
    volumes:
      # Volume nomeado: os dados sobrevivem a `docker compose down`.
      - govambiental-db-data:/var/opt/mssql
    networks:
      - govambiental-net
    healthcheck:
      # Versões recentes da imagem do SQL Server não trazem mais o sqlcmd, então
      # o teste cai para uma checagem de porta TCP quando a ferramenta não existe.
      test: >-
        /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -No -Q "SELECT 1" > /dev/null 2>&1
        || timeout 3 bash -c "< /dev/tcp/localhost/1433"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: final
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    image: govambiental-api:dev
    container_name: govambiental-api-dev
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      APP_VERSION: ${APP_VERSION:-dev}
      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=${DB_NAME:-GovAmbientalDb};User Id=sa;Password=${SA_PASSWORD:-Gov@mbiental2026};TrustServerCertificate=True;Encrypt=False"
      Jwt__Key: ${JWT_KEY:-chave-super-secreta-gov-ambiental-fiap-2026-minimo-32-bytes!}
      Jwt__Issuer: ${JWT_ISSUER:-GovAmbiental.API}
      Jwt__Audience: ${JWT_AUDIENCE:-GovAmbiental.Clients}
      AuthCredentials__Email: ${AUTH_EMAIL:-auditor@govambiental.com}
      AuthCredentials__Senha: ${AUTH_PASSWORD:-Auditor@123}
    ports:
      - "${API_PORT:-8080}:8080"
    networks:
      - govambiental-net
    restart: unless-stopped

networks:
  govambiental-net:
    driver: bridge

volumes:
  govambiental-db-data:
    driver: local
